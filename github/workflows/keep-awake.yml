name: Keep app awake (LaunchCast NFL)

# OPTIONAL — keeps the NFL app from sleeping so it opens instantly on gamedays.
# NFL data is permanent (nflverse), so unlike MLB there are NO snapshots to
# capture — this ONLY prevents slow cold-starts. Safe to delete if you don't
# mind a ~20s wake on first open. Pings during NFL game windows (Thu/Sun/Mon).
on:
  schedule:
    # Sundays 12pm-11pm ET (main slate) — 17:00-04:00 UTC every 20 min
    - cron: "*/20 17-23 * * 0"
    - cron: "*/20 0-4 * * 1"
    # Thursday + Monday night (23:00-04:00 UTC every 20 min)
    - cron: "*/20 23 * * 4"
    - cron: "*/20 0-4 * * 5"
    - cron: "*/20 0-4 * * 2"
  workflow_dispatch:

concurrency:
  group: nfl-keep-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5   # MLB lesson: always cap so it can't hang
    steps:
      - name: Light ping to keep the app awake
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "APP_URL secret not set — skipping (nothing to ping)."
            exit 0
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 60 "$APP_URL" || echo "000")
          echo "Keep-alive ping → HTTP $code"
          exit 0
